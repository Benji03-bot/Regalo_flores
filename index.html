<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Para Jimena · Flores Amarillas</title>
<style>
:root{--cream:#fffaf0;--yellow:#f7c948;--gold:#c98a12;--green:#5b7f55;--ink:#453a2a}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);font-family:Georgia,"Times New Roman",serif;background:radial-gradient(circle at 15% 15%,#fff0ad 0,transparent 27%),radial-gradient(circle at 90% 85%,#e7f0df 0,transparent 25%),var(--cream);overflow-x:hidden}
.petal{position:fixed;width:11px;height:17px;border-radius:100% 0 100% 0;background:#f6c84b;opacity:.48;z-index:0;animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(-12vh) rotate(15deg)}100%{transform:translateY(112vh) rotate(390deg)}}
.hero{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative}
.card{width:min(920px,100%);text-align:center;padding:55px 28px 48px;background:rgba(255,253,248,.88);border:1px solid #efd28a;border-radius:34px;box-shadow:0 25px 80px #71551d20;backdrop-filter:blur(10px);position:relative;z-index:1;animation:appear .9s ease both}
@keyframes appear{from{opacity:0;transform:translateY(25px) scale(.98)}to{opacity:1;transform:none}}
.kicker{font:700 12px Arial,sans-serif;letter-spacing:3px;text-transform:uppercase;color:var(--green)}
.name{font-size:clamp(20px,3vw,30px);letter-spacing:2px;margin:20px 0 5px;color:#7b6a4b}
.bouquet{font-size:clamp(58px,10vw,92px);margin:10px 0;animation:float 3.5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-9px) rotate(1.5deg)}}
h1{font-size:clamp(40px,7vw,76px);line-height:.95;margin:10px 0 20px;color:#a86e08}
.subtitle{font-size:clamp(17px,2.5vw,23px);line-height:1.55;max-width:700px;margin:0 auto 28px}
.cta{display:inline-block;padding:15px 28px;border-radius:999px;background:var(--yellow);color:#4a3710;text-decoration:none;font:700 14px Arial,sans-serif;box-shadow:0 10px 25px #e9a91a35;transition:.3s}
.cta:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 14px 30px #e9a91a45}
footer{padding:25px;text-align:center;font:13px Arial,sans-serif;color:#766b58}
</style></head>
<body>
<script>
for(let i=0;i<22;i++){let p=document.createElement('span');p.className='petal';p.style.left=Math.random()*100+'vw';p.style.animationDuration=7+Math.random()*8+'s';p.style.animationDelay=-Math.random()*12+'s';p.style.transform='scale('+(0.55+Math.random()*0.7)+') rotate(20deg)';document.body.appendChild(p)}
</script>
<section class="hero"><div class="card">
<div class="kicker">21 de septiembre · Día de las Flores Amarillas</div>
<div class="name">Para Jimena Landaverde</div>
<div class="bouquet">🌻🌼💛🌼🌻</div>
<h1>Un pequeño<br>detalle para ti</h1>
<p class="subtitle">Porque hay días en los que una flor dice, sin necesidad de demasiadas palabras, todo lo que uno siente.</p>
<a class="cta" href="bouquet.html">Abrir mi mensaje ✨</a>
</div></section>
<footer>Un pequeño detalle hecho con cariño · 21 de septiembre</footer>
</body></html>
